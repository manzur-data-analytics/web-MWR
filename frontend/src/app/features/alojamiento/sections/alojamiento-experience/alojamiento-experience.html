<section id="servicios" class="bg-brand-bg py-20 lg:py-28">
    <div class="max-w-6xl mx-auto px-6 lg:px-10">
        <div class="text-center max-w-3xl mx-auto mb-12 lg:mb-16">
            <span class="uppercase tracking-[0.4em] text-[10px] sm:text-xs text-brand-terracotta">
                {{ 'ACCOMMODATION.EXPERIENCE.SUBTITLE' | transloco }}
            </span>
            <h2 class="mt-5 font-title text-4xl sm:text-5xl font-light text-brand-dark">
                {{ 'ACCOMMODATION.EXPERIENCE.TITLE' | transloco }}
            </h2>
            <div class="w-16 h-px bg-brand-sand mt-7 mx-auto"></div>
        </div>
        <div class="grid sm:grid-cols-2 lg:grid-cols-3 gap-x-10 gap-y-8 lg:gap-y-12">
            @for (number of amenityNumbers; track number) {
                <article class="service-item">
                    <h3>{{ 'ACCOMMODATION.EXPERIENCE.AMENITY' + number | transloco }}</h3>
                    <p>{{ 'ACCOMMODATION.EXPERIENCE.AMENITY' + number + '_DESC' | transloco }}</p>
                </article>
            }
        </div>
    </div>
</section>
