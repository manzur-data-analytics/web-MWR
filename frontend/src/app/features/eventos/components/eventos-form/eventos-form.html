<form class="space-y-8" (submit)="submit($event)">
                        <input type="checkbox" name="botcheck" tabindex="-1" autocomplete="off" style="display: none" aria-hidden="true">

                        <!-- Selector: Tipo de Evento -->
                        <div>
                            <label
                                class="uppercase tracking-[0.2em] text-[11px] text-brand-terracotta font-semibold block mb-3">
                                {{'EVENTS.QUOTE.EVENT_TYPE' | transloco}}
                            </label>

                            <!-- Grid ajustado: 2 columnas en mobile/tablet y 4 solo en pantallas XL -->
                            <div class="grid grid-cols-2 xl:grid-cols-4 gap-2.5">
                                <button *ngFor="let type of eventTypes" type="button"
                                    (click)="selectedType = type.value"
                                    class="py-2.5 px-1.5 border text-[11px] xl:text-xs font-medium uppercase text-center transition-all duration-300 leading-snug flex items-center justify-center min-h-[48px] whitespace-normal"
                                    [class.bg-brand-dark]="selectedType === type.value"
                                    [class.text-white]="selectedType === type.value"
                                    [class.border-brand-dark]="selectedType === type.value"
                                    [class.bg-white]="selectedType !== type.value"
                                    [class.text-brand-dark]="selectedType !== type.value"
                                    [class.hover:border-brand-gold]="selectedType !== type.value">

                                    <span>
                                        {{ type.label | transloco }}
                                    </span>

                                </button>
                            </div>
                        </div>

                        <!-- Campos de Información Personal -->
                        <div class="grid md:grid-cols-2 gap-5 sm:gap-6">
                            <div class="relative">
                                <input name="name" type="text" required autocomplete="name" [attr.aria-label]="'EVENTS.QUOTE.NAME' | transloco"
                                    class="luxury-input border border-brand-sand px-5 py-4 bg-white/80 w-full text-sm text-brand-dark focus:bg-white focus:outline-none focus:border-brand-gold transition-all"
                                    placeholder="{{'EVENTS.QUOTE.NAME' | transloco}}">
                            </div>

                            <div class="relative">
                                <input name="email" type="email" required autocomplete="email" [attr.aria-label]="'EVENTS.QUOTE.EMAIL' | transloco"
                                    class="luxury-input border border-brand-sand px-5 py-4 bg-white/80 w-full text-sm text-brand-dark focus:bg-white focus:outline-none focus:border-brand-gold transition-all"
                                    placeholder="{{'EVENTS.QUOTE.EMAIL' | transloco}}">
                            </div>

                            <div class="relative">
                                <input name="Telefono" type="tel" autocomplete="tel" [attr.aria-label]="'EVENTS.QUOTE.PHONE' | transloco"
                                    class="luxury-input border border-brand-sand px-5 py-4 bg-white/80 w-full text-sm text-brand-dark focus:bg-white focus:outline-none focus:border-brand-gold transition-all"
                                    placeholder="{{'EVENTS.QUOTE.PHONE' | transloco}}">
                            </div>

                            <div class="relative">
                                <input name="Invitados" type="number" min="1" [attr.aria-label]="'EVENTS.QUOTE.GUESTS' | transloco"
                                    class="luxury-input border border-brand-sand px-5 py-4 bg-white/80 w-full text-sm text-brand-dark focus:bg-white focus:outline-none focus:border-brand-gold transition-all"
                                    placeholder="{{'EVENTS.QUOTE.GUESTS' | transloco}}">
                            </div>
                        </div>

                        <!-- Selector: Tipo de Fecha + Input -->
                        <div
                            class="bg-white/50 p-4 sm:p-5 border border-brand-sand rounded-sm space-y-4 max-w-full overflow-hidden">
                            <label
                                class="uppercase tracking-[0.2em] sm:tracking-[0.3em] text-[11px] text-brand-terracotta font-semibold block">
                                {{'EVENTS.QUOTE.DATE_TYPE' | transloco}}
                            </label>

                            <div class="flex gap-2.5 sm:gap-3">
                                <button type="button" (click)="dateType='exact'"
                                    class="flex-1 py-2.5 px-2 sm:px-4 text-[11px] sm:text-xs tracking-wider uppercase font-medium border transition-all duration-300 whitespace-normal leading-snug"
                                    [class.bg-brand-gold]="dateType==='exact'" [class.text-white]="dateType==='exact'"
                                    [class.border-brand-gold]="dateType==='exact'" [class.bg-white]="dateType!=='exact'"
                                    [class.text-brand-dark]="dateType!=='exact'"
                                    [class.border-brand-sand]="dateType!=='exact'">
                                    {{'EVENTS.QUOTE.EXACT_DATE' | transloco}}
                                </button>

                                <button type="button" (click)="dateType='month'"
                                    class="flex-1 py-2.5 px-2 sm:px-4 text-[11px] sm:text-xs tracking-wider uppercase font-medium border transition-all duration-300 whitespace-normal leading-snug"
                                    [class.bg-brand-gold]="dateType==='month'" [class.text-white]="dateType==='month'"
                                    [class.border-brand-gold]="dateType==='month'" [class.bg-white]="dateType!=='month'"
                                    [class.text-brand-dark]="dateType!=='month'"
                                    [class.border-brand-sand]="dateType!=='month'">
                                    {{'EVENTS.QUOTE.MONTH_ONLY' | transloco}}
                                </button>
                            </div>

                            <!-- Inputs adaptados para pantallas móviles sin desborde -->
                            <input *ngIf="dateType === 'exact'" name="Fecha" type="date" [attr.aria-label]="'EVENTS.QUOTE.EXACT_DATE' | transloco"
                                class="luxury-input border border-brand-sand px-3.5 sm:px-5 py-3 bg-white w-full max-w-full min-w-0 box-border text-xs sm:text-sm text-brand-dark focus:outline-none focus:border-brand-gold appearance-none">

                            <input *ngIf="dateType === 'month'" name="Fecha" type="month" [attr.aria-label]="'EVENTS.QUOTE.MONTH_ONLY' | transloco"
                                class="luxury-input border border-brand-sand px-3.5 sm:px-5 py-3 bg-white w-full max-w-full min-w-0 box-border text-xs sm:text-sm text-brand-dark focus:outline-none focus:border-brand-gold appearance-none">
                        </div>

                        <!-- Presupuesto y Mensaje -->
                        <div class="space-y-5">
                            <input name="Presupuesto" [attr.aria-label]="'EVENTS.QUOTE.BUDGET' | transloco"
                                class="luxury-input border border-brand-sand px-5 py-4 bg-white/80 w-full text-sm text-brand-dark focus:bg-white focus:outline-none focus:border-brand-gold transition-all"
                                placeholder="{{'EVENTS.QUOTE.BUDGET' | transloco}}">

                            <textarea name="Mensaje" [attr.aria-label]="'EVENTS.QUOTE.MESSAGE' | transloco"
                                class="luxury-input h-32 border border-brand-sand px-5 py-4 bg-white/80 w-full text-sm text-brand-dark focus:bg-white focus:outline-none focus:border-brand-gold resize-none transition-all"
                                placeholder="{{'EVENTS.QUOTE.MESSAGE' | transloco}}"></textarea>
                        </div>

                        <!-- Botón Submit -->
                        <button type="submit" [disabled]="sending"
                            class="site-button w-full">
                            {{ (sending ? 'EVENTS.QUOTE.SENDING' : 'EVENTS.QUOTE.BUTTON') | transloco }}
                        </button>

                        <p *ngIf="status === 'success'" role="status" class="text-brand-dark text-sm">{{ 'EVENTS.QUOTE.SUCCESS' | transloco }}</p>
                        <p *ngIf="status === 'error'" role="alert" class="text-brand-terracotta text-sm">{{ 'EVENTS.QUOTE.ERROR' | transloco }}</p>

                    </form>
