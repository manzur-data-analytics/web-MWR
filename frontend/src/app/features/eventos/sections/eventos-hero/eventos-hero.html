<section class="relative min-h-screen overflow-hidden">
    <!-- Imagen -->
    <img src="https://images.unsplash.com/photo-1519167758481-83f550bb49b3?auto=format&fit=crop&w=2200&q=90"
        class="absolute inset-0 w-full h-full object-cover">

    <!-- Overlay -->
    <div class="absolute inset-0 bg-gradient-to-r from-[#382821]/90 via-[#382821]/60 to-[#382821]/20"></div>

    <!-- Decoración -->
    <div
        class="absolute right-10 top-24 sm:right-20 sm:top-32 w-72 h-72 sm:w-96 sm:h-96 rounded-full bg-[#d4a15a]/20 blur-3xl">
    </div>

    <!-- Contenido -->
    <div class="relative z-10 max-w-7xl mx-auto px-6 lg:px-10 min-h-screen flex items-center py-32 lg:py-36">
        <div class="max-w-3xl">
            <span class="uppercase tracking-[0.5em] text-[#d4a15a] text-xs">
                {{'EVENTS.HERO.SUBTITLE' | transloco}}
            </span>

            <h1 class="mt-5 sm:mt-6 font-title text-4xl sm:text-5xl xl:text-7xl font-light leading-tight text-white">
                {{'EVENTS.HERO.TITLE' | transloco}}
            </h1>

            <div class="w-16 sm:w-24 h-px bg-[#d4a15a] my-7 sm:my-10"></div>

            <p class="max-w-xl text-white/80 text-base sm:text-lg leading-7 sm:leading-9">
                {{'EVENTS.HERO.DESCRIPTION' | transloco}}
            </p>

            <div class="flex flex-col sm:flex-row sm:items-center gap-5 sm:gap-8 mt-10 sm:mt-12">

                <a href="#cotizacion"
                    class="luxury-btn px-9 py-4 border border-[#8e4c2f] text-white uppercase tracking-[0.3em] text-xs text-center w-full sm:w-auto">
                    <span>
                        {{'EVENTS.HERO.BUTTON' | transloco}}
                    </span>
                </a>
            </div>
        </div>
    </div>
</section>
