<section class="page-hero relative overflow-hidden">
    <!-- Imagen -->
    <img src="images/secciones/eventos/hero/hotel-0141.webp" alt="" fetchpriority="high"
        class="absolute inset-0 w-full h-full object-cover">

    <!-- Overlay -->
    <div class="absolute inset-0 bg-gradient-to-r from-brand-dark/80 via-brand-dark/55 to-black/20"></div>

    <!-- Decoración -->
    <div
        class="absolute right-10 top-24 sm:right-20 sm:top-32 w-72 h-72 sm:w-96 sm:h-96 rounded-full bg-brand-gold/20 blur-3xl">
    </div>

    <!-- Contenido -->
    <div class="page-hero-content relative z-10 max-w-7xl mx-auto px-6 lg:px-10 flex items-center py-32 lg:py-36">
        <div class="max-w-3xl">
            <span class="uppercase tracking-[0.3em] text-brand-sand text-xs sm:text-sm">
                {{ 'EVENTS.HERO.SUBTITLE' | transloco }}
            </span>
            <h1 class="mt-5 sm:mt-6 font-title text-4xl sm:text-5xl xl:text-6xl font-light leading-tight text-white">
                {{'EVENTS.HERO.TITLE' | transloco}}
            </h1>

            <div class="w-16 sm:w-24 h-px bg-brand-gold my-7 sm:my-10"></div>

            <p class="max-w-2xl text-white/95 text-lg sm:text-xl leading-8 sm:leading-9">
                {{'EVENTS.HERO.DESCRIPTION' | transloco}}
            </p>

            <div class="flex flex-col sm:flex-row sm:items-center gap-5 sm:gap-8 mt-10 sm:mt-12">

                <a href="#formulario-cotizacion" (click)="$event.preventDefault(); scroll.scrollTo('#formulario-cotizacion', 2)"
                    class="site-button site-button--hero">
                    <span>
                        {{'EVENTS.HERO.BUTTON' | transloco}}
                    </span>
                </a>
            </div>
        </div>
    </div>
</section>
