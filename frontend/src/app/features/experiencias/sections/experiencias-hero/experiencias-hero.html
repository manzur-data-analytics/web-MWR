<section class="page-hero relative overflow-hidden">

    <!-- Fondo -->
    <img src="images/secciones/experiencias/hero/picnic-jardines-paleta-del-pintor.jpg"
        [alt]="'EXPERIENCES.SIGNATURE.PICNIC_TITLE' | transloco" fetchpriority="high"
        class="absolute inset-0 w-full h-full object-cover object-[50%_60%]">

    <div class="absolute inset-0 bg-gradient-to-b from-brand-black/80 via-brand-black/65 to-brand-black/50"></div>

    <div class="page-hero-content relative z-10 max-w-7xl mx-auto px-6 lg:px-10 flex justify-center items-start py-32 lg:py-36 text-center">

        <div class="max-w-3xl">
            <span class="uppercase tracking-[0.5em] text-brand-bg text-xs">
                {{'EXPERIENCES.HERO.SUBTITLE' | transloco}}
            </span>

            <h1 class="mt-6 font-title text-5xl md:text-6xl xl:text-7xl font-light leading-tight text-white">
                {{'EXPERIENCES.HERO.TITLE' | transloco}}
            </h1>

            <div class="w-24 h-px bg-brand-gold mx-auto my-10"></div>

            <p class="text-white text-lg leading-9 max-w-2xl mx-auto">
                {{'EXPERIENCES.HERO.DESCRIPTION' | transloco}}
            </p>

            <div class="flex flex-col sm:flex-row justify-center gap-5 mt-12">
                <a href="#signature-experiences" class="site-button site-button--hero">
                    <span>
                        {{'EXPERIENCES.HERO.BUTTON' | transloco}}
                    </span>

                </a>

            </div>

        </div>

    </div>

</section>
