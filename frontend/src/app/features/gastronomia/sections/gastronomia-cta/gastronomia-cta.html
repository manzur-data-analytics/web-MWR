<section class="grid overflow-hidden bg-[#382821] lg:grid-cols-2">
    <div class="flex items-center px-6 py-20 sm:px-12 sm:py-24 lg:py-28 xl:pl-[max(2.5rem,calc((100vw-80rem)/2+2.5rem))] xl:pr-16">
        <div class="w-full max-w-xl">
            <span class="uppercase tracking-[0.3em] text-[#e8bd80] text-xs sm:text-sm">
                {{ 'GASTRONOMY.CTA.SUBTITLE' | transloco }}
            </span>
            <h2 class="mt-6 font-title text-[2.5rem] sm:text-[3.25rem] xl:text-[4rem] font-light leading-tight text-white">
                {{ 'GASTRONOMY.CTA.TITLE' | transloco }}
            </h2>
            <div class="my-8 sm:my-10 h-px w-20 bg-[#d4a15a]" aria-hidden="true"></div>
            <p class="text-lg sm:text-xl leading-8 sm:leading-9 text-white/85">
                {{ 'GASTRONOMY.CTA.DESCRIPTION' | transloco }}
            </p>
            <div class="mt-10 flex flex-col gap-4 sm:flex-row sm:flex-wrap sm:mt-12">
                <a href="#" class="inline-flex items-center justify-center px-8 py-4 bg-[#8e4c2f] text-white hover:bg-[#743d26] font-medium uppercase tracking-[0.25em] text-sm transition-colors focus-visible:outline-2 focus-visible:outline-offset-4 focus-visible:outline-white">
                    {{ 'GASTRONOMY.CTA.BUTTON' | transloco }}
                </a>
                <a href="#" class="inline-flex items-center justify-center px-8 py-4 border border-[#d4a15a] text-[#e8bd80] hover:bg-[#d4a15a] hover:text-[#382821] font-medium uppercase tracking-[0.25em] text-sm transition-colors focus-visible:outline-2 focus-visible:outline-offset-4 focus-visible:outline-white">
                    {{ 'GASTRONOMY.CTA.MENU' | transloco }}
                </a>
            </div>
        </div>
    </div>
    <div class="relative min-h-[360px] sm:min-h-[460px] lg:min-h-[640px]">
        <img src="secciones/gastronomia/cta/vino-0110.jpg"
            [alt]="'GASTRONOMY.CTA.IMAGE_ALT' | transloco" loading="lazy"
            class="absolute inset-0 h-full w-full object-cover">
    </div>
</section>
