<section class="cta-scene">
    <div class="cta-backdrop">
        <img src="images/secciones/gastronomia/experiencia/copa-aperitivo-0197.jpg"
            [alt]="'GASTRONOMY.EXPERIENCE.WINE_BAR.IMAGE_ALT' | transloco" loading="lazy"
            class="h-full w-full object-cover">
        <div class="cta-shade" aria-hidden="true"></div>
    </div>
    <div class="cta-content px-6 py-24 sm:px-12">
        <div class="mx-auto w-full max-w-3xl text-center">
            <span class="uppercase tracking-[0.3em] text-[#e8bd80] text-xs sm:text-sm">
                {{ 'GASTRONOMY.CTA.SUBTITLE' | transloco }}
            </span>
            <h2 class="mt-6 font-title text-[2.5rem] sm:text-[3.25rem] xl:text-[4rem] font-light leading-tight text-white">
                {{ 'GASTRONOMY.CTA.TITLE' | transloco }}
            </h2>
            <div class="mx-auto my-8 sm:my-10 h-px w-20 bg-[#d4a15a]" aria-hidden="true"></div>
            <p class="mx-auto max-w-2xl text-lg sm:text-xl leading-8 sm:leading-9 text-white/95">
                {{ 'GASTRONOMY.CTA.DESCRIPTION' | transloco }}
            </p>
            <div class="mt-10 flex flex-col justify-center gap-4 sm:flex-row sm:flex-wrap sm:mt-12">
                <a href="#" class="inline-flex items-center justify-center px-8 py-4 bg-[#8e4c2f] text-white hover:bg-[#743d26] font-medium uppercase tracking-[0.25em] text-sm transition-colors focus-visible:outline-2 focus-visible:outline-offset-4 focus-visible:outline-white">
                    {{ 'GASTRONOMY.CTA.BUTTON' | transloco }}
                </a>
                <a href="#" class="inline-flex items-center justify-center px-8 py-4 border border-[#e8bd80] bg-black/25 text-[#e8bd80] hover:bg-[#d4a15a] hover:text-[#382821] font-medium uppercase tracking-[0.25em] text-sm transition-colors focus-visible:outline-2 focus-visible:outline-offset-4 focus-visible:outline-white">
                    {{ 'GASTRONOMY.CTA.MENU' | transloco }}
                </a>
            </div>
        </div>
    </div>
</section>
