<!-- ALOJAMIENTO -->
<section id="alojamiento" class="relative bg-brand-bg py-20 lg:py-28 overflow-hidden">

    <!-- fondos -->
    <div class="absolute right-0 top-0 h-full w-[35%] bg-brand-sand hidden lg:block"></div>

    <div class="absolute -left-32 top-20 w-80 h-80 rounded-full bg-brand-sand/20 blur-3xl"></div>

    <img src="images/brand/ilustraciones/mwr_ilustraciones5.webp" alt="" aria-hidden="true" loading="lazy"
        class="pointer-events-none absolute right-[38%] top-6 hidden w-48 opacity-30 mix-blend-multiply lg:block">

    <div class="relative max-w-7xl mx-auto px-5 sm:px-8 lg:px-10">


        <!-- TITULO -->
        <div class="max-w-2xl mb-12 lg:mb-16">


            <span class="
            uppercase
            tracking-[0.45em]
            text-[10px]
            lg:text-[11px]
            text-brand-terracotta">

                {{'HOME.ACCOMMODATION.TITLE' | transloco}}

            </span>



            <h2 class="
            mt-4
            font-title
            text-4xl
            sm:text-5xl
            font-light
            leading-tight
            text-brand-dark">

                {{'HOME.ACCOMMODATION.SUBTITLE' | transloco}}

            </h2>


            <div class="w-20 h-px bg-brand-sand mt-6"></div>


        </div>





        <!-- CONTENIDO -->


        <div class="relative">



            <!-- IMAGEN -->

            <div class="
            relative
            w-full
            lg:w-[78%]
            aspect-[4/3]
            sm:aspect-[16/9]
            overflow-hidden
            shadow-[0_25px_70px_rgba(59,40,33,.18)]">


                <img src="images/home/alojamiento/primera-0113.webp"
                    [alt]="'HOME.ACCOMMODATION.CARD_TITLE' | transloco"
                    loading="lazy"
                    class="absolute inset-0 w-full h-full object-cover">


                <div class="
                absolute inset-0
                bg-gradient-to-t
                from-brand-dark/30
                via-transparent
                to-transparent">
                </div>


            </div>

            <!-- TARJETA -->
            <div class="mt-8 lg:mt-0 lg:absolute lg:right-0 lg:top-1/2 lg:-translate-y-1/2 bg-brand-bg w-full sm:max-w-xl lg:max-w-md
                p-7 sm:p-10 shadow-[0_20px_60px_rgba(59,40,33,.12)]">
                <span class="
                uppercase
                tracking-[0.35em]
                text-[10px]
                text-brand-terracotta">

                    {{'HOME.ACCOMMODATION.CARD_LABEL' | transloco}}

                </span>

                <h3 class="
                mt-4
                font-title
                text-3xl
                whitespace-pre-line
                sm:text-4xl
                font-light
                text-brand-dark">


                    {{'HOME.ACCOMMODATION.CARD_TITLE' | transloco}}


                </h3>

                <p class="
                mt-5
                text-sm
                sm:text-base
                leading-8
                text-brand-muted">

                    {{'HOME.ACCOMMODATION.DESCRIPTION' | transloco}}

                </p>


                <a routerLink="/alojamiento" class="site-button mt-8">

                    {{'HOME.ACCOMMODATION.BUTTON' | transloco}}



                </a>

            </div>

        </div>

    </div>

</section>
