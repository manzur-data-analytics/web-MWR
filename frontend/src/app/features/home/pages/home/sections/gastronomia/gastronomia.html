<section class="relative py-24 lg:py-36 overflow-hidden">

    <!-- Fondo fijo ambiente -->
    <div class="absolute inset-0 overflow-hidden">

        <img src="images/home/gastronomia/segunda-0287.jpg"
            class="background-fixed">

    </div>


    <!-- overlay fondo -->
    <div class="absolute inset-0 bg-brand-dark/75">
    </div>


    <div class="relative z-10 max-w-7xl mx-auto px-6 lg:px-10">


        <!-- Imagen principal -->

        <div class="max-w-5xl mx-auto">

            <div class="relative overflow-hidden shadow-2xl">

                <img src="images/home/gastronomia/primera-0130.jpg"
                    class="main-image">

            </div>

        </div>



        <!-- Texto -->

        <div class="max-w-3xl mx-auto text-center mt-14 lg:mt-20">


            <span class="
                uppercase
                tracking-[0.5em]
                text-brand-bg
                text-[11px]">

                {{'HOME.GASTRONOMY.PREVIEW.SUBTITLE' | transloco}}

            </span>



            <h2 class="gastronomy-title
                mt-6
                font-title
                font-light
                text-white">

                @let title = 'HOME.GASTRONOMY.PREVIEW.TITLE' | transloco;
                <span class="block whitespace-nowrap">{{ title.split(' & ')[0] }}</span>
                <span class="block whitespace-nowrap">&amp; {{ title.split(' & ')[1] }}</span>

            </h2>



            <div class="
                w-24
                h-px
                bg-brand-gold
                mx-auto
                my-8">
            </div>



            <p class="
                text-white/80
                text-base
                sm:text-lg
                leading-8">

                {{'HOME.GASTRONOMY.PREVIEW.DESCRIPTION' | transloco}}

            </p>



            <a routerLink="/gastronomia" class="site-button site-button--light mt-10">


                {{'HOME.GASTRONOMY.PREVIEW.BUTTON' | transloco}}





            </a>


        </div>


    </div>


</section>
