<section class="relative py-24 lg:py-36 overflow-hidden">

    <!-- Fondo fijo ambiente -->
    <div class="absolute inset-0 overflow-hidden">

        <img src="images/home/gastronomia/segunda-0287.jpg"
            class="background-fixed">

    </div>


    <!-- overlay fondo -->
    <div class="absolute inset-0 bg-[#382821]/75">
    </div>


    <div class="relative z-10 max-w-7xl mx-auto px-6 lg:px-10">


        <!-- Imagen principal -->

        <div class="max-w-5xl mx-auto">

            <div class="relative overflow-hidden shadow-2xl">

                <img src="images/home/gastronomia/primera-0302.jpg"
                    class="main-image">

            </div>

        </div>



        <!-- Texto -->

        <div class="max-w-3xl mx-auto text-center mt-14 lg:mt-20">


            <span class="
                uppercase
                tracking-[0.5em]
                text-[#d4a15a]
                text-[11px]">

                {{'HOME.GASTRONOMY.PREVIEW.SUBTITLE' | transloco}}

            </span>



            <h2 class="
                mt-6
                font-title
                text-4xl
                sm:text-5xl
                lg:text-6xl
                font-light

                {{'HOME.GASTRONOMY.PREVIEW.TITLE' | transloco}}

            </h2>



            <div class="
                w-24
                h-px
                bg-[#d4a15a]
                mx-auto
                my-8">

            <p class="
                text-white/80
                text-base
                sm:text-lg
                leading-8">

                {{'HOME.GASTRONOMY.PREVIEW.DESCRIPTION' | transloco}}

            </p>



            <a routerLink="/gastronomia" class="
                inline-flex
                items-center
                gap-4
                mt-10
                uppercase
                tracking-[0.35em]
                text-xs
                text-[#d4a15a]
                group">


                {{'HOME.GASTRONOMY.PREVIEW.BUTTON' | transloco}}


                <span class="
                    w-10
                    h-px
                    bg-[#d4a15a]
                    transition-all
                    duration-500
                    group-hover:w-16">

            </a>


        </div>


    </div>
