<section id="inicio" class="relative min-h-[100svh] w-full overflow-hidden">

    <!-- Imagen -->
    <img src="images/home/hero/hotel.png" alt="MWR Hotel"
        class="absolute inset-0 h-full w-full object-cover object-center">


    <!-- Overlay -->
    <div class="absolute inset-0 bg-black/35"></div>


    <!-- Contenido -->
    <div class="relative z-10 flex min-h-[100svh] items-center justify-center px-6 sm:px-10 py-24">


        <div class="text-center animate-fade-up w-full max-w-5xl">


            <!-- Título -->
            <h1 class="font-title text-white mt-5 
                text-4xl 
                sm:text-6xl 
                md:text-7xl 
                xl:text-[7.5rem]
                font-light
                leading-[1.05]
                break-words">

                {{ 'HOME.TITLE' | transloco }}

            </h1>


            <!-- Línea -->
            <div class="w-20 sm:w-24 h-px bg-white/70 mx-auto my-7 sm:my-8">
            </div>


            <!-- Descripción -->
            <p class="font-body text-white/85 
                text-sm 
                sm:text-base 
                md:text-lg
                leading-7
                sm:leading-8
                tracking-wide
                max-w-xl
                mx-auto">

                {{ 'HOME.DESCRIPTION' | transloco }}

            </p>


        </div>

    </div>

</section>
