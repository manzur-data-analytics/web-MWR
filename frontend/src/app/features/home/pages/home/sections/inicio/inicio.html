<section id="inicio" class="page-hero relative w-full overflow-hidden">

    <div class="hero-mobile-background" aria-hidden="true">
        <img src="videos/inicio2-poster.jpg" alt="">
    </div>

    <div class="hero-media absolute inset-0 overflow-hidden">
        <!-- Imagen de respaldo -->
        <img src="videos/inicio2-poster.jpg" alt=""
            class="absolute inset-0 h-full w-full object-cover object-center">

        <video class="hero-video absolute inset-0 h-full w-full object-cover object-center"
            [class.hero-video--playing]="videoPlaying" (playing)="videoPlaying = true" (pause)="videoPlaying = false"
            autoplay muted [muted]="true" loop playsinline preload="metadata" aria-hidden="true" tabindex="-1">
            <source src="videos/inicio2-web.mp4" type="video/mp4">
        </video>
    </div>

    <!-- Overlay -->
    <div class="hero-overlay absolute inset-0 bg-black/35"></div>


    <!-- Contenido -->
    <div class="page-hero-content hero-content relative z-10 flex items-end justify-center px-6 sm:px-10">


        <div class="text-center animate-fade-up w-full max-w-5xl">


            <!-- Línea -->
            <div class="hero-divider w-20 sm:w-24 h-px bg-white/70 mx-auto my-7 sm:my-8">
            </div>


            <!-- Descripción -->
            <p class="hero-description font-body text-white/85 
                text-sm 
                sm:text-base 
                md:text-lg
                leading-7
                sm:leading-8
                tracking-wide
                max-w-xl
                mx-auto">

                {{ 'HOME.DESCRIPTION' | transloco }}

            </p>


        </div>

    </div>

</section>
