<section class="relative py-20 sm:py-24 lg:py-36 bg-brand-bg overflow-hidden">

    <div class="absolute left-0 top-20 w-72 sm:w-96 h-72 sm:h-96 rounded-full bg-brand-gold/10 blur-3xl"></div>

    <img src="images/brand/ilustraciones/mwr_ilustraciones3.png" alt="" aria-hidden="true" loading="lazy"
        class="pointer-events-none absolute -left-8 bottom-0 hidden w-40 opacity-20 mix-blend-multiply xl:block">

    <div class="relative max-w-7xl mx-auto px-5 sm:px-6 lg:px-10 overflow-hidden">

        <div class="grid grid-cols-1 lg:grid-cols-12 gap-12 lg:gap-16 items-center">


            <!-- TEXTO -->

            <div class="lg:col-span-5 min-w-0">


                <span class="uppercase tracking-[0.2em] sm:tracking-[0.45em] text-[10px] sm:text-xs text-brand-terracotta">

                    {{'HOME.ABOUT.SUBTITLE' | transloco}}

                </span>


                <h2
                    class="mt-5 sm:mt-6 font-title text-3xl sm:text-5xl xl:text-6xl font-light leading-[1.15] text-brand-dark break-words">

                    {{'HOME.ABOUT.TITLE' | transloco}}

                </h2>


                <div class="w-16 sm:w-24 h-px bg-brand-gold my-7 sm:my-8"></div>


                <p class="max-w-full break-words text-brand-muted leading-8 sm:leading-9 text-base sm:text-lg">

                    {{'HOME.ABOUT.DESCRIPTION' | transloco}}

                </p>



                <a routerLink="/nosotros"
                    class="site-button mt-10 sm:mt-12">

                    {{'HOME.ABOUT.BUTTON' | transloco}}



                </a>


            </div>




            <!-- FOTOS -->

            <div class="lg:col-span-7 min-w-0 w-full">


                <div class="history-gallery">
                    <img src="images/secciones/nosotros/galeria_pergola.jpg"
                        [alt]="'ABOUT_PAGE.GALLERY.PERGOLA' | transloco"
                        loading="lazy" decoding="async">
                </div>


            </div>


        </div>

    </div>

</section>
