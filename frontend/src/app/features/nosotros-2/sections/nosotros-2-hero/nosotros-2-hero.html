<section class="relative min-h-screen overflow-hidden">

    <!-- BACKGROUND -->
    <img src="https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?auto=format&fit=crop&w=2200&q=90"
        class="absolute inset-0 w-full h-full object-cover scale-105">


    <!-- OVERLAY -->
    <div class="absolute inset-0 
        bg-gradient-to-r 
        from-[#382821]/90 
        via-[#382821]/60 
        to-black/20">
    </div>



    <!-- DECORACION -->
    <div class="
        absolute 
        right-0 
        top-32 
        w-96 
        h-96 
        bg-[#d4a15a]/20 
        blur-3xl 
        rounded-full">
    </div>



    <!-- CONTENT -->
    <div class="
        relative z-10
        max-w-7xl
        mx-auto
        px-6 lg:px-10
        min-h-screen
        flex
        items-center
        py-32">


        <div class="max-w-3xl">


            <span class="
                uppercase
                tracking-[0.5em]
                text-[#d4a15a]
                text-xs">

                {{'ABOUT.HERO.SUBTITLE' | transloco}}

            </span>



            <h1 class="
                mt-6
                font-title
                text-5xl
                xl:text-7xl
                font-light
                leading-tight
                text-white">

                {{'ABOUT.HERO.TITLE' | transloco}}

            </h1>



            <div class="
                w-24
                h-px
                bg-[#d4a15a]
                my-10">
            </div>



            <p class="
                max-w-xl
                text-white/80
                text-lg
                leading-9">

                {{'ABOUT.HERO.DESCRIPTION' | transloco}}

            </p>


        </div>


    </div>

</section>
