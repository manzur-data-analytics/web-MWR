<section class="relative min-h-screen overflow-hidden">

    <!-- Imagen de fondo con animación -->
    <img src="https://images.unsplash.com/photo-1544161515-4ab6ce6db874?auto=format&fit=crop&w=2200&q=80"
        class="absolute inset-0 w-full h-full object-cover scale-105 animate-[slowZoom_18s_linear_infinite_alternate]">

    <!-- Overlay -->
    <div class="absolute inset-0 bg-gradient-to-r from-[#2f2825]/80 via-[#382821]/50 to-transparent"></div>

    <!-- Mancha decorativa -->
    <div class="absolute right-16 top-24 w-96 h-96 rounded-full bg-[#7c9a98]/20 blur-3xl pointer-events-none"></div>

    <!-- Contenido -->
    <div class="relative z-10 max-w-7xl mx-auto px-6 lg:px-10 min-h-screen flex items-center py-32 lg:py-36">

        <div class="max-w-3xl">

            <span class="uppercase tracking-[0.5em] text-[#d8c8b1] text-xs">
                {{ 'SPA.HERO.SUBTITLE' | transloco }}
            </span>

            <h1 class="mt-5 sm:mt-6 font-title text-4xl sm:text-5xl xl:text-7xl font-light leading-tight text-white">
                {{ 'SPA.HERO.TITLE' | transloco }}
            </h1>

            <div class="w-16 sm:w-24 h-px bg-[#d8c8b1] my-7 sm:my-10"></div>

            <p class="max-w-xl text-white/80 text-base sm:text-lg leading-7 sm:leading-9">
                {{ 'SPA.HERO.DESCRIPTION' | transloco }}
            </p>

            <div class="flex flex-col sm:flex-row sm:items-center gap-5 sm:gap-8 mt-10 sm:mt-12">

                <!-- Botón 1 (Principal): Cambio de color simple -->
                <a href="#spa-day" class="luxury-btn">
                    <span>
                        {{ 'SPA.HERO.BUTTON' | transloco }}
                    </span>
                </a>

                <!-- Botón 2 (Secundario): Se pinta hacia la derecha al hover -->
                <a href="#tratamientos" class="luxury-outline-btn">
                    <span>
                        {{ 'SPA.HERO.TREATMENTS' | transloco }}
                    </span>
                </a>

            </div>

        </div>

    </div>

</section>
