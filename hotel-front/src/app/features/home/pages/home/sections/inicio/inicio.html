<section id="inicio" class="relative h-screen w-full overflow-hidden">

    <!-- Imagen -->
    <img src="/inicio/hotel/hotel.png" alt="MWR Hotel"
        class="absolute inset-0 h-full w-full object-cover object-center">

    <!-- Overlay -->
    <div class="absolute inset-0 bg-black/35"></div>

    <!-- Contenido -->
    <div class="relative z-10 flex h-full items-center justify-center px-6">

        <div class="text-center animate-fade-up max-w-4xl">

            <!-- Título -->
            <h1 class="font-title mt-5 text-white text-6xl md:text-8xl xl:text-[7.5rem] font-light leading-none">
                {{ 'HOME.TITLE' | transloco }}
            </h1>

            <!-- Línea decorativa -->
            <div class="w-24 h-px bg-white/70 mx-auto my-8">
            </div>

            <!-- Descripción -->
            <p class="font-body text-white/85 text-base md:text-lg leading-8 tracking-wide max-w-2xl mx-auto">
                {{ 'HOME.DESCRIPTION' | transloco }}

            </p>

        </div>

    </div>

</section>
