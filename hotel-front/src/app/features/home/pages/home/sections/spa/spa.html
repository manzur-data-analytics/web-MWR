<section id="spa" class="relative bg-[#f4f1ed] py-24 lg:py-32 overflow-hidden">

    <!-- decoración -->
    <div class="absolute inset-0 opacity-[.07]">
        <img src="https://images.unsplash.com/photo-1519823551278-64ac92734fb1?auto=format&fit=crop&w=2000&q=80"
            class="w-full h-full object-cover">
    </div>

    <div class="relative max-w-7xl mx-auto px-6 lg:px-10">

        <div class="grid lg:grid-cols-12 gap-16 items-center">

            <!-- Imagen -->

            <div class="lg:col-span-7">

                <div class="relative overflow-hidden">

                    <img src="https://images.unsplash.com/photo-1544161515-4ab6ce6db874?auto=format&fit=crop&w=1600&q=80"
                        class="w-full h-[620px] object-cover transition duration-700 hover:scale-105">

                    <div class="absolute bottom-8 left-8 bg-white/90 backdrop-blur px-8 py-6">

                        <span class="uppercase tracking-[.35em] text-[10px] text-[#bb644a]">

                            WELLNESS

                        </span>

                        <h3 class="font-title text-3xl text-[#382821] mt-2">

                            Wine Spa

                        </h3>

                    </div>

                </div>

            </div>

            <!-- Texto -->

            <div class="lg:col-span-5">

                <span class="uppercase tracking-[0.45em] text-xs text-[#8e4c2f]">

                    {{'HOME.SPA.SUBTITLE' | transloco}}

                </span>

                <h2 class="mt-5 font-title text-5xl font-light text-[#382821]">

                    {{'HOME.SPA.TITLE' | transloco}}

                </h2>

                <div class="w-24 h-px bg-[#c8b89a] mt-8"></div>

                <p class="mt-8 text-[#5c5a3e] leading-9">

                    {{'HOME.SPA.DESCRIPTION' | transloco}}

                </p>

                <!-- highlights -->

                <div class="mt-10 space-y-5">

                    <div class="flex items-center gap-4">

                        <span class="w-2 h-2 rounded-full bg-[#bb644a]"></span>

                        {{'HOME.SPA.ITEM1' | transloco}}

                    </div>

                    <div class="flex items-center gap-4">

                        <span class="w-2 h-2 rounded-full bg-[#bb644a]"></span>

                        {{'HOME.SPA.ITEM2' | transloco}}

                    </div>

                    <div class="flex items-center gap-4">

                        <span class="w-2 h-2 rounded-full bg-[#bb644a]"></span>

                        {{'HOME.SPA.ITEM3' | transloco}}

                    </div>

                </div>

                <div class="flex flex-wrap gap-4 mt-12">

                    <a routerLink="/spa" class="luxury-btn">

                        <span>

                            {{'HOME.SPA.BUTTON' | transloco}}

                        </span>

                    </a>

                    <a href="https://wa.me/549..."
                        class="uppercase tracking-[.3em] text-xs text-[#8e4c2f] inline-flex items-center gap-3">

                        {{'HOME.SPA.RESERVE' | transloco}}

                        <span class="w-10 h-px bg-[#8e4c2f]"></span>

                    </a>

                </div>

            </div>

        </div>

    </div>

</section>
